services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: busbooking
      POSTGRES_USER: busapp
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U busapp -d busbooking"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [backend]
    restart: unless-stopped

  api:
    build: .
    image: bus-booking-api:${IMAGE_TAG:-local}
    environment:
      DATABASE_URL: postgresql+psycopg://busapp:${DB_PASSWORD}@db:5432/busbooking
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready')"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [backend, edge]
    restart: unless-stopped

  proxy:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
      # For HTTPS, add a valid certificate and enable the 443 server block in deploy/nginx-https.conf.
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [api]
    networks: [edge]
    restart: unless-stopped

volumes:
  postgres_data:
networks:
  backend:
    internal: true
  edge:
