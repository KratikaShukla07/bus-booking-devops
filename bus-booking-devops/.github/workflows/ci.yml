name: CI
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
permissions:
  contents: read
  packages: write
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Compile check
        run: python -m compileall -q app tests
      - name: Lint and static checks
        run: ruff check app tests --select E9,F63,F7,F82
      - name: Tests
        run: pytest -q
      - name: Build container image
        run: docker build -t bus-booking-api:${{ github.sha }} .
      - name: Container vulnerability scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: bus-booking-api:${{ github.sha }}
          format: table
          exit-code: '0'
          ignore-unfixed: true
